spring.application.name=todo-api

# Port and message can be overridden by environment variables
# (APP_PORT / APP_MESSAGE), which is how the Kubernetes ConfigMap sets them.
server.port=${APP_PORT:8080}
app.message=${APP_MESSAGE:Hello from todo-api}
app.version=@project.version@

# Health endpoints used by the liveness/readiness probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
