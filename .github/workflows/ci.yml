name: CI

# Runs alongside Jenkins: builds and tests the app on every push and pull request
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B test

      - name: Build versioned JAR
        run: ./mvnw -B -DskipTests -Drevision=1.0.${{ github.run_number }}-gh package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: todo-api-jar
          path: target/todo-api-*.jar
